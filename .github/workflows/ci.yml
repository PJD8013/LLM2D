# Checks every push: unit and browser tests, type checks, sample validation, app builds and the
# runtime packages (the same commands as "Verify changes" in CLAUDE.md).
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest moves to a newer release, and Playwright's --with-deps only knows
    # the releases that existed when its version came out.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Validate samples
        run: pnpm validate

      - name: Samples are up to date
        run: |
          pnpm samples
          git diff --exit-code --stat

      - name: Build apps
        run: |
          pnpm --filter @llm2d/viewer build
          pnpm --filter @llm2d/editor build
          pnpm --filter @llm2d/reel-demo build

      - name: Pack runtime packages
        run: pnpm pack:lib
