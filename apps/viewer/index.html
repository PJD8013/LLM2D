<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM2D Viewer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <aside id="panel">
      <header>
        <h1>LLM2D <span>Viewer</span></h1>
      </header>

      <section>
        <label class="row">
          <span>샘플</span>
          <select id="sample">
            <option value="bolt/bolt.l2d.json">Bolt (호스트 로봇)</option>
            <option value="gem/gem.l2d.json">Gem (슬롯 심볼)</option>
          </select>
        </label>
        <label class="file">
          <input id="files" type="file" multiple accept=".json,.png,.webp,.jpg" />
          <span>파일 열기 (.l2d.json + 이미지)</span>
        </label>
        <p class="hint">창에 파일을 끌어다 놓아도 됩니다.</p>
      </section>

      <section>
        <h2>애니메이션</h2>
        <div id="animations" class="chips"></div>
        <div class="row">
          <label><input id="loop" type="checkbox" checked /> 반복</label>
          <label><input id="autoBlink" type="checkbox" checked /> 자동 깜빡임</label>
        </div>
        <label class="row slider">
          <span>속도</span>
          <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" />
          <output id="speedOut">1.00x</output>
        </label>
        <label class="row slider">
          <span>전환</span>
          <input id="mix" type="range" min="0" max="0.6" step="0.05" value="0.2" />
          <output id="mixOut">0.20s</output>
        </label>
      </section>

      <section>
        <h2>타임라인</h2>
        <div class="row">
          <button id="play" type="button">일시정지</button>
          <output id="time">0.00 / 0.00s</output>
        </div>
        <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
      </section>

      <section>
        <h2>보기</h2>
        <div class="row wrap">
          <label><input id="dbgBones" type="checkbox" /> 뼈</label>
          <label><input id="dbgMeshes" type="checkbox" /> 메시</label>
          <label><input id="dbgIk" type="checkbox" /> IK</label>
        </div>
        <label class="row">
          <span>배경</span>
          <select id="bg">
            <option value="dark">어두움</option>
            <option value="light">밝음</option>
            <option value="checker">체커</option>
          </select>
        </label>
      </section>

      <section>
        <h2>정보</h2>
        <pre id="info"></pre>
      </section>

      <section class="grow">
        <h2>이벤트</h2>
        <ol id="events"></ol>
      </section>
    </aside>
    <main id="stage" data-bg="dark">
      <div id="error" hidden></div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
